services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miracle-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    env_file:
      - path: .env
        required: false

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: miracle-portfolio-tunnel
    restart: unless-stopped
    # profiles:
      # - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: eyJhIjoiNDUyNWRiYWNmYzJhNDE4MzdhMmM5ZTc5ODA1OTdiMTkiLCJ0IjoiZDg1NDkzODItZWM3MS00OWIzLWE1MWMtYzliZTVlNmM2MzFkIiwicyI6Ik9HRTVNRE14TVdJdE5qUXhOQzAwWkdSaUxXRXpNall0T0dFNU0ySTBNV1E1T1RVeSJ9
    depends_on:
      portfolio:
        condition: service_healthy
